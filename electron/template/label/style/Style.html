<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: {{secondColumnFontSize}}mm;
        }

        .container {
            display: flex;
            padding-left: {{marginLeftMM}}mm;
            gap: 3mm;
            width: fit-content;
            height: {{heightMM}}mm;
        }

        .label {
            width: {{widthMM}}mm;
            height: {{heightMM}}mm;
            margin-top: {{marginMM}}mm;
            line-height: {{heightMM}}mm;
            display: flex;
            flex-direction: row;
            align-items: center;
            box-sizing: border-box;
            text-align: center;
        }

        .barcode-container {
            text-align: center;
            margin-right: 2mm;
        }
        .barcode-container img {
            width: 20mm;
            height: 3mm;
            object-fit: contain;
        }
        .barcode-number {
            font-size: 2.8mm;
            font-weight: bold;
        }
        .text-date {
            font-size: 2.1mm;
            font-weight: bold;
            margin-top: 0.5mm;
        }

        .param-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .param-row {
            display: flex;
            align-items: center;
            margin-bottom: 1mm;
        }

        .label-title {
            font-size: 2.2mm;
        }
        .label-value {
            font-size: 2.2mm;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    {{labelsHTML}}
</div>
</body>
</html>
